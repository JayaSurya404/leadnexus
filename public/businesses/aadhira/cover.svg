<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gridG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgG)"/>
  <!-- Sun graphic -->
  <circle cx="1000" cy="100" r="180" fill="#eab308" opacity="0.15"/>
  <circle cx="1000" cy="100" r="120" fill="#eab308" opacity="0.25"/>
  <!-- Solar panels pattern -->
  <g transform="translate(650, 180) skewX(-20)" fill="url(#gridG)" stroke="#0f172a" stroke-width="3">
    <rect x="0" y="0" width="100" height="70" rx="4"/>
    <rect x="110" y="0" width="100" height="70" rx="4"/>
    <rect x="220" y="0" width="100" height="70" rx="4"/>
    <rect x="0" y="80" width="100" height="70" rx="4"/>
    <rect x="110" y="80" width="100" height="70" rx="4"/>
    <rect x="220" y="80" width="100" height="70" rx="4"/>
  </g>
  <!-- Text -->
  <text x="80" y="170" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#ffffff">Aadhira SunGrid Energy</text>
  <text x="80" y="225" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#fde047">Smarter Rooftop Solar Solutions for Tamil Nadu</text>
  <rect x="80" y="260" width="220" height="48" rx="8" fill="#22c55e"/>
  <text x="120" y="291" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Coimbatore • Tiruppur • Salem</text>
</svg>